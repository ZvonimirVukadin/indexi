name: Ažuriranje podataka

on:
  # Glavni okidač: vanjski cron (cron-job.org) poziva workflow_dispatch preko GitHub API-ja
  # jer GitHubov raspored kasni satima. Termini i postavljanje: README.md.
  workflow_dispatch:
  schedule:
    # Samo rezerva ako vanjski okidač zakaže (GitHub ih zna odgoditi i po nekoliko sati)
    - cron: "17 21 * * 1-5"
    - cron: "37 11 * * *"

permissions:
  contents: write

# Pokretanja koja se preklope idu jedno za drugim, ne istodobno
concurrency:
  group: azuriranje-podataka
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/fetch_data.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "Ažurirani podaci"
          git pull --rebase -X theirs origin main
          git push
