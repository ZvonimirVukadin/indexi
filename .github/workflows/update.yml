name: Ažuriranje podataka

on:
  schedule:
    # Tijekom US trgovanja (pon–pet), izvan punog i polusata jer GitHub tada manje kasni
    - cron: "7,37 13-20 * * 1-5"
    - cron: "17 21 * * 1-5"
    # Svaki dan u 13:00 po zagrebačkom vremenu: start u 11:37 (09:37 UTC ljeti, 10:37 UTC zimi),
    # pa korak Termin čeka do 13:00 jer GitHub često kasni i više od 40 min
    - cron: "37 9 * * *"
    - cron: "37 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Termin
        id: gate
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Zagreb date +%z)
          run=true
          wait=false
          case "$CRON" in
            "37 9 * * *") [ "$offset" = "+0200" ] && wait=true || run=false ;;
            "37 10 * * *") [ "$offset" = "+0100" ] && wait=true || run=false ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$wait" = true ]; then
            left=$(( $(TZ=Europe/Zagreb date -d "13:00" +%s) - $(date +%s) ))
            if [ "$left" -gt 0 ]; then sleep "$left"; fi
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - run: python scripts/fetch_data.py
        if: steps.gate.outputs.run == 'true'
      - name: Commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "Ažurirani podaci"
          git pull --rebase -X theirs origin main
          git push
